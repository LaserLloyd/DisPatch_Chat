# Image Studio — an operator-only tool for making pictures from the configured
# image API provider (Settings → AI & Connections → Image generation). Prompt, aspect
# ratio, count, optimizer, seed and a reference image in; a results grid out,
# with send-to-chat and set-as-avatar. Nothing runs unless the operator presses
# Generate. Contract: docs/apps.md.
id: imagestudio
title: Image Studio
icon: images
safe: false                     # 3.x Safe-Mode key: accepted, never read
order: 60
# Who may use it: Users and Admins by default; an Admin may switch it on for a Basic profile.
# Each profile sees only its own pictures (the ledger carries owner_profile_id).
permission: use_images
env: []
