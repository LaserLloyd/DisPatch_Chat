name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Action majors are kept in step with .github/workflows/docker-publish.yml —
# bump both together, or the two files drift into different runtimes.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The most important job in this file. A pull request that would publish
  # somebody's chat history, a hostname or an API key fails here before a human
  # ever reviews it. Runs first and blocks everything else.
  privacy:
    name: No private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Scan the tree for private data
        run: python3 scripts/scrub_check.py

  test:
    name: Tests (Python ${{ matrix.python }})
    needs: privacy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        # Exact version, NOT a floating major: astral-sh/setup-uv stopped
        # publishing moving major tags after v7, so `@v8`, `@v9` and `@v10` do
        # not resolve at all ("unable to find version `v10`") even though
        # v10.0.1 exists. Bump this to the newest v10.x deliberately.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install poppler and zstd
        # `pdftotext` reads the text layer of an attached PDF and `zstd`
        # decodes dsh session logs; without them those tests skip (a skip is
        # not a pass).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils zstd
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Run the test suite
        working-directory: backend
        run: uv run pytest -q

  windows:
    name: Windows (imports, collects, frontend)
    needs: privacy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The backend imports and the suite collects on native Windows
        # `import fcntl` once made this impossible. The FULL suite still runs on Linux
        # (POSIX paths, process groups); this job is the importability guard.
        working-directory: backend
        env:
          PYTHONUTF8: "1"
          DISPATCH_DATA_DIR: ${{ runner.temp }}\dispatch-data
        run: |
          uv sync --frozen --python 3.12
          uv run python -c "import app.main"
          uv run pytest --co -q
      - name: Frontend tests on Windows
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:ci

  lint:
    name: Lint
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        # Exact version — see the note in the `test` job above.
        uses: astral-sh/setup-uv@v10.0.1
      - name: Ruff
        # Pinned: an unpinned `uvx ruff` is "newest that day", and new ruff
        # releases grow the selected rule families (RUF100, UP037, DTZ...), so
        # main went red with no code change. Bump deliberately, fix, commit.
        working-directory: backend
        run: uvx ruff@0.17.0 check app tests
      - name: Vendored ForgeUI bundle matches forgeui.json
        # frontend/static/ui-theme/ is the ForgeUI (ThemeForge) bundle, vendored whole.
        # This fails on a different version, a stale or hand-edited bundle file, a
        # missing or changed overlay, or settings naming a theme the bundle lacks.
        # Fix: `python -m forgeui vendor` (docs/development.md, "Themes"). forgeui is
        # installed from a pinned ThemeForge commit, never PyPI (that name belongs to
        # another project). TODO: switch to `@v1.2.0` once the owner tags that release.
        run: |
          uv venv --python 3.12 .forgeui-venv
          uv pip install --python .forgeui-venv "forgeui @ git+https://github.com/LaserLloyd/ThemeForge@d70f6608bdf386fc095d43fc1caec61e88664795"
          .forgeui-venv/bin/python -m forgeui vendor --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax check
        # No build step by design, so this is the only thing standing between a
        # typo and a blank page. Every module is parsed as ESM.
        # setup-node, not `apt-get install nodejs`: the distro package is years
        # behind and `node --test` (used below) needs a current runtime.
        run: |
          for f in frontend/static/js/*.js frontend/static/sw.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "::error file=$f::syntax error"; exit 1; }
          done
          echo "All frontend modules parse."
      - name: Install test dependencies
        # jsdom, and nothing else. The app itself has no dependencies and no
        # build step; this is purely so the DOM half of the suite RUNS.
        #
        # Without it a third of the suite reported as SKIPPED inside a green
        # run — every Job Board render-path assertion, both modal focus traps
        # and the whole sanitizer suite — so CI was green over 243 of 339
        # tests and nobody could tell from the summary.
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend tests
        # node --check only PARSES. It cannot see that a function being called
        # does not exist — which is exactly the bug that shipped: two calls to
        # functions that were never defined, in a path no reloading end-to-end
        # test ever exercised. tests/callable.test.js is the guard for that
        # class; the rest cover No-Image Mode's decision logic.
        #
        # `test:ci` sets CI_REQUIRE_DOM=1, so if the install above ever stops
        # providing jsdom the suite FAILS instead of quietly skipping back to
        # 243. A skipped test is not a passing one.
        working-directory: frontend
        run: npm run test:ci

  locales:
    name: Translations
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate locale files
        # No `if [ -f ... ]` guard. This step used to skip when the checker was
        # "missing" — and it always was, because it looked for check_locales.py
        # while the script is check-locales.py. The job went green for weeks
        # having validated nothing. A gate that can silently opt itself out is
        # not a gate: if the checker is gone, that is a failure.
        run: python3 scripts/check-locales.py

      - name: Locale HTML allowlist self-test
        # The locale checker is also an XSS boundary: translated values reach
        # innerHTML through i18n.js, so a translation PR is an injection vector.
        # These fixtures assert the allowlist still rejects the attacks it was
        # written for — a regression here is invisible against real locale files,
        # which are (correctly) clean.
        run: python3 scripts/check-locales.py --selftest

  audit:
    name: Dependency audit
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        # Exact version - see the note in the `test` job above.
        uses: astral-sh/setup-uv@v10.0.1
      - name: pip-audit the locked set
        # Audits exactly what `uv sync --frozen` installs: the lockfile exported
        # with every extra (so the optional agents-claude pin is covered too),
        # then checked against the PyPI advisory database. `--no-deps` because the
        # export is already fully resolved and pinned; `--disable-pip` so nothing
        # is installed or resolved. Any finding exits non-zero and fails the job.
        # pip-audit is pinned: an unpinned `uvx pip-audit` is "newest that day".
        # Bump deliberately. Do NOT add `--ignore-vuln` without a comment naming
        # the advisory, why it cannot be fixed, and when to revisit it.
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras > "$RUNNER_TEMP/requirements-audit.txt"
          uvx --python 3.12 pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements-audit.txt" --no-deps --disable-pip --strict

  docker:
    name: Docker image builds
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (amd64 + arm64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build with the voice add-on (VOICE=1, amd64, loaded for the import check)
        # The add-on is two packages (dispatch-voice + forge-voice-core) installed from one ref; a
        # build that cannot resolve them, or an image that cannot import them, fails here.
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VOICE=1
            VOICE_REF=refs/heads/main
          load: true
          push: false
          tags: dispatch-chat:ci-voice
          cache-from: type=gha,scope=voice
          cache-to: type=gha,mode=max,scope=voice
      - name: The voice image imports both add-on packages
        run: docker run --rm --entrypoint python dispatch-chat:ci-voice -I -c "import dispatch_voice, forge_voice_core; print('ok')"
