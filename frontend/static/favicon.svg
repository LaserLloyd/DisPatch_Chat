<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DisPatch">
  <!-- DisPatch's mark (4.0): a "D" whose bowl is a speech bubble — the tail at
       the foot of the stem — holding a small lit house: conversation, at home.
       Ivory line on a deep navy tile, the house in brass; one stroke weight,
       round joins, like the app's chrome icons. It reads as a D down to 16 px.
       Keep index.html's inline .boot-logo in step with this file, and re-render
       favicon.ico, favicon-32.png, icon-192.png and icon-512.png from it. -->
  <defs>
    <linearGradient id="dp-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2033"/>
      <stop offset="1" stop-color="#0d1020"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#dp-tile)"/>
  <path d="M16.5 14.5 H32 A18.5 17 0 0 1 32 48.5 H24.5 L16 54 L16.5 48.5 Z" fill="none" stroke="#f2ebdd" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M33.2 23.7 L41.5 30.6 Q42.1 31.1 42.1 31.9 V39.1 Q42.1 40.1 41.1 40.1 H25.3 Q24.3 40.1 24.3 39.1 V31.9 Q24.3 31.1 24.9 30.6 Z M30.9 40.1 V35.6 a2.3 2.3 0 0 1 4.6 0 V40.1 Z" fill="#c9a35b" fill-rule="evenodd"/>
</svg>
