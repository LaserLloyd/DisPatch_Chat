[project]
name = "dispatch-chat"
version = "3.0.0"
description = "Self-hosted chat for your household and your AI agents"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    # Security floor: 12.3.0 fixes all 13 advisories on 12.2.0 (font/PCF/BDF parsing;
    # the app decodes user-uploaded images). Wheels exist for cp312/cp313 on Windows + Linux.
    "pillow>=12.3.0",
    "httpx>=0.27.0",
    "anthropic>=0.120.2",
    # PDF text extraction for image-only PDFs (scans, app screenshots).
    # Optional at import time — `_pdf_ocr_head_text` skips OCR when missing.
    "rapidocr-onnxruntime>=1.4.4",
    # Web Push (app/push.py): VAPID signing + aes128gcm payload encryption.
    # Pure-python itself; its deps (cryptography, aiohttp, requests) ship
    # wheels. Nothing is fetched at runtime.
    "pywebpush>=2.5.0",
    "ddgs>=9.16,<10",
    # argon2id for profile PINs and passwords (app/credentials.py). Already pulled in by
    # pywebpush; declared because 3.0 imports it directly (needs >= 44 for Argon2id).
    "cryptography>=44",
    # Security floors on TRANSITIVE packages (pulled in by fastapi/httpx/anthropic, declared
    # here so a fresh resolve can never land on a vulnerable release). Raise, never lower.
    # starlette 1.3.1: PYSEC-2026-248 (path validation) + -249 (request.form() limits; the
    # app accepts multipart uploads). fastapi 0.136.x accepts starlette >= 1.
    "starlette>=1.3.1",
    # anyio 4.14.2: PYSEC-2026-4024 / -4025.
    "anyio>=4.14.2",
]

[project.optional-dependencies]
# Agent dispatch, Claude Agent backend (docs/agents/backends.md). OPTIONAL and pinned
# EXACTLY (RESEARCH.md section 5 item 6): the SDK bundles the Claude CLI binary (~117 MB
# wheel) and moves fast, so an upgrade is a deliberate change plus a contract-suite run.
# It is imported lazily, only inside the per-task worker process - the default install
# and the whole `app.agents` package work without it.
agents-claude = ["claude-agent-sdk==0.2.168"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
]
# Kept EMPTY on purpose: voice chat left DisPatch in 2.2.0 and is the separate
# DisPatch Voice add-on (docs/extensions.md). The group stays declared so a
# pre-2.2 unit drop-in (`uv run --group voice …`) still boots — without it uv
# exits 2 ("Group `voice` is not defined") and the restart loop takes the
# family app down (hardening H1). Removed in 2.3.0.
voice = []

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
# `../apps` collects each app package's own tests (apps/<id>/tests/test_*.py);
# apps/conftest.py hands them this suite's fixtures and hermetic guards.
testpaths = ["tests", "../apps"]
asyncio_mode = "auto"
timeout = 600
pythonpath = ["."]

# --------------------------------------------------------------------------- #
# Ruff
#
# CI runs `uvx ruff@<pinned> check app tests` (see .github/workflows/ci.yml).
# Without an explicit config that means the rule set moves under us and a green
# branch can go red with no code change, so everything below is pinned on
# purpose: the families we want, and a short reason for every rule we turn off.
# An ignore here is a statement that the pattern is deliberate — not a snooze.
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
# The code runs to ~90 columns for real code and lets prose comments trail past
# it (p99 is 90, a handful of explanatory comments reach ~140). 120 is the
# budget for actual code; E501 is off below so a long comment never fails CI.
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes — real dead code and typos
    "I",      # import sorting
    "UP",     # pyupgrade — we are py312+, no need for the old spellings
    "B",      # bugbear
    "C4",     # comprehension clarity
    "PIE",    # misc lints
    "DTZ",    # datetime awareness
    "RUF",    # ruff's own
]
ignore = [
    # Comments and docstrings carry the "why" in this codebase and are allowed
    # to run long; line-length above still governs the formatter.
    "E501",
    # Nearly every hit is the deliberate "translate a caught error into a
    # client-facing one" pattern (`except ValueError: raise HTTPException(400)`
    # / `raise WorkflowError(...)`). The caught exception is the implementation
    # detail being hidden; chaining it back in is noise, not context.
    "B904",
    # FastAPI's whole calling convention is `x = Depends(...)` / `Query(...)`
    # in the signature default. Not a mutable-default bug.
    "B008",
    # Best-effort/fail-open paths catch `Exception` on purpose: a broken avatar,
    # a dead rig or an unparseable transcript must never take the chat down.
    # Narrowing these would change behaviour, which is the opposite of the goal.
    # (Selected via B, so it needs turning off explicitly.)
    "BLE001",
    # `datetime.now()` here is the box-local clock on purpose — daily thread
    # rollover, the night window and the user-facing UI are all local-time
    # concepts. UTC would be the bug.
    "DTZ005",
    # Unpacking a whole tuple (`rc, out, err = ...`) documents the shape of the
    # return even when a slot is unused; renaming to `_err` reads worse.
    "RUF059",
    # The UI copy, log lines and docstrings use real typography (—, ’, …) and
    # emoji on purpose; "ambiguous unicode" is the intended character.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# One parser function builds a list of dicts and advances an index on the same
# line (`items.append({...}); idx += 1`) so the six near-identical branches stay
# visually parallel. Splitting them doubles the height for no clarity.
"app/openclaw.py" = ["E702"]
"tests/*" = [
    # Importing a pytest fixture into another module is how fixtures are shared;
    # pyflakes reads it as an unused import and every use as a redefinition.
    "F401",
    "F811",
    # Tests line up cheap setup on one line to keep the interesting assertion
    # visible; that is a readability choice, not a mistake.
    "E702",
    # `[m for m in rows if ...][0]` is the assertion: the row must exist, and
    # IndexError names the failure better than next()'s StopIteration.
    "RUF015",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
